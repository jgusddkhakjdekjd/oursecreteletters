<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Letters & Virtual Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF8F5;
      color: #2D2424;
      overflow-x: hidden;
    }
    .font-serif-title { font-family: 'Cinzel', serif; }
    .font-handwriting { font-family: 'Caveat', cursive; }
    
    /* Moving Sky & Cloud Animations */
    .sky-container {
      background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 50%, #FAF8F5 100%);
      position: relative;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      animation: floatClouds linear infinite;
      filter: blur(1px);
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }
    .cloud-1 { width: 120px; height: 40px; top: 15%; animation-duration: 35s; }
    .cloud-1::before { width: 50px; height: 50px; top: -20px; left: 15px; }
    .cloud-1::after { width: 40px; height: 40px; top: -15px; right: 15px; }

    .cloud-2 { width: 180px; height: 50px; top: 40%; animation-duration: 50s; animation-delay: -15s; }
    .cloud-2::before { width: 70px; height: 70px; top: -30px; left: 25px; }
    .cloud-2::after { width: 50px; height: 50px; top: -20px; right: 25px; }

    @keyframes floatClouds {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(100vw); }
    }

    /* Grass Horizon */
    .grass-horizon {
      background: linear-gradient(180deg, #A7F3D0 0%, #059669 100%);
      border-radius: 50% 50% 0 0 / 20px 20px 0 0;
    }

    /* Floating Hearts */
    .floating-heart {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 1.8s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
      50% { opacity: 0.9; transform: translateY(-60px) scale(1.2) rotate(15deg); }
      100% { opacity: 0; transform: translateY(-120px) scale(1) rotate(-15deg); }
    }

    .crayon-style {
      filter: url(#crayon-filter);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- SVG Crayon Texture Filter -->
  <svg class="hidden">
    <defs>
      <filter id="crayon-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- HEADER -->
  <header class="border-b border-stone-200 bg-white/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-600 text-xl shadow-sm">
          💌
        </div>
        <div>
          <h1 class="font-serif-title text-xl font-bold tracking-wide text-stone-800">Our Sanctuary</h1>
          <p class="text-xs text-stone-500">Shared Letters, Bouquets & Companion</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span id="sync-status" class="text-xs font-medium text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Instant Active
        </span>
        <button onclick="openModal()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition flex items-center gap-2">
          ✏️ Send Letter / Bouquet
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-12">
    
    <!-- TABS -->
    <div class="flex gap-2 border-b border-stone-200 pb-1">
      <button id="tab-letters" onclick="switchTab('letters')" class="px-5 py-2.5 rounded-t-xl font-medium text-sm transition flex items-center gap-2 bg-stone-800 text-white">
        ❤️ Love Letters & Bouquets (<span id="count-letters">0</span>)
      </button>
      <button id="tab-notes" onclick="switchTab('notes')" class="px-5 py-2.5 rounded-t-xl font-medium text-sm transition flex items-center gap-2 text-stone-600 hover:bg-stone-100">
        📝 Sticky Notes (<span id="count-notes">0</span>)
      </button>
    </div>

    <!-- TAB 1: LOVE LETTERS -->
    <section id="view-letters" class="space-y-6">
      <div id="letters-list" class="grid gap-6 md:grid-cols-2"></div>
    </section>

    <!-- TAB 2: STICKY NOTES -->
    <section id="view-notes" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-amber-50/50 border border-amber-100 p-4 rounded-2xl">
        <p class="text-xs text-amber-800 font-medium">Leave quick sweet notes on the shared wall.</p>
        <button onclick="addStickyNote()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
          📌 Add Sticky Note
        </button>
      </div>
      <div id="notes-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </section>

    <!-- VIRTUAL PET DOG -->
    <section class="rounded-3xl border border-sky-200/80 shadow-md overflow-hidden sky-container relative pt-12 pb-0">
      
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>

      <div class="text-center space-y-1 relative z-10 px-4">
        <span class="text-xs uppercase font-bold tracking-widest text-sky-700 bg-white/60 px-3 py-1 rounded-full backdrop-blur-sm border border-sky-100">Virtual Companion</span>
        <h2 class="font-serif-title text-2xl font-bold text-stone-800 mt-2">Pet Our Puppy</h2>
        <p class="text-xs text-stone-600">Click or tap to pet him! Total Pets Shared: <span id="pet-counter" class="font-bold text-rose-500">0</span></p>
      </div>

      <!-- Grass Ground -->
      <div class="mt-12 grass-horizon py-8 px-6 relative flex flex-col items-center justify-end min-h-[180px]">
        
        <!-- Crayon-drawn Flowers -->
        <div class="absolute bottom-3 left-8 flex gap-4 crayon-style">
          <svg width="24" height="40" viewBox="0 0 24 40"><path d="M12 40 Q10 20 12 0" stroke="#047857" stroke-width="3" fill="none"/><circle cx="12" cy="6" r="6" fill="#F43F5E"/><circle cx="6" cy="12" r="6" fill="#F43F5E"/><circle cx="18" cy="12" r="6" fill="#F43F5E"/><circle cx="12" cy="18" r="6" fill="#F43F5E"/><circle cx="12" cy="12" r="4" fill="#FDE047"/></svg>
          <svg width="20" height="35" viewBox="0 0 20 35"><path d="M10 35 Q12 18 10 0" stroke="#047857" stroke-width="3" fill="none"/><circle cx="10" cy="8" r="7" fill="#A855F7"/><circle cx="10" cy="8" r="3" fill="#FEF08A"/></svg>
        </div>
        <div class="absolute bottom-3 right-8 flex gap-4 crayon-style">
          <svg width="22" height="38" viewBox="0 0 22 38"><path d="M11 38 Q9 19 11 0" stroke="#047857" stroke-width="3" fill="none"/><circle cx="11" cy="8" r="7" fill="#3B82F6"/><circle cx="11" cy="8" r="3" fill="#FFFFFF"/></svg>
          <svg width="24" height="42" viewBox="0 0 24 42"><path d="M12 42 Q14 21 12 0" stroke="#047857" stroke-width="3" fill="none"/><circle cx="12" cy="6" r="6" fill="#FB923C"/><circle cx="6" cy="12" r="6" fill="#FB923C"/><circle cx="18" cy="12" r="6" fill="#FB923C"/><circle cx="12" cy="18" r="6" fill="#FB923C"/><circle cx="12" cy="12" r="4" fill="#FEF08A"/></svg>
        </div>

        <!-- Crayon Dog -->
        <div id="dog-container" onclick="petDog(event)" class="cursor-pointer relative transition-transform duration-150 active:scale-95 hover:scale-105 crayon-style">
          <svg id="dog-svg" width="120" height="110" viewBox="0 0 120 110" fill="none" class="drop-shadow-md">
            <path id="dog-tail" d="M25 65 Q10 50 18 35" stroke="#D97706" stroke-width="8" stroke-linecap="round"/>
            <ellipse cx="55" cy="70" rx="35" ry="25" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
            <rect x="40" y="85" width="10" height="20" rx="5" fill="#D97706" stroke="#B45309" stroke-width="2"/>
            <rect x="60" y="85" width="10" height="20" rx="5" fill="#D97706" stroke="#B45309" stroke-width="2"/>
            <ellipse cx="28" cy="82" rx="12" ry="10" fill="#D97706" stroke="#B45309" stroke-width="2"/>
            <ellipse cx="82" cy="82" rx="12" ry="10" fill="#D97706" stroke="#B45309" stroke-width="2"/>
            <circle cx="75" cy="40" r="22" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
            <path d="M58 28 Q50 45 55 52" stroke="#78350F" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M92 28 Q100 45 95 52" stroke="#78350F" stroke-width="7" stroke-linecap="round" fill="none"/>
            <ellipse cx="82" cy="45" rx="9" ry="7" fill="#FEF3C7"/>
            <circle cx="85" cy="42" r="3" fill="#1F2937"/>
            <circle cx="72" cy="35" r="3" fill="#1F2937"/>
            <circle cx="84" cy="35" r="3" fill="#1F2937"/>
            <path d="M60 56 Q75 62 88 56" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
            <circle cx="74" cy="60" r="3" fill="#FBBF24"/>
          </svg>
        </div>

      </div>
    </section>

  </main>

  <!-- WRITE LETTER MODAL -->
  <div id="letter-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-5 border border-stone-100 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-serif-title text-xl font-bold text-stone-800">Compose Love Letter</h3>
        <button onclick="closeModal()" class="text-stone-400 hover:text-stone-600 text-xl font-bold">&times;</button>
      </div>

      <form id="write-letter-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-1">Author</label>
          <input type="text" id="input-author" required placeholder="Your name" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-1">Title / Subject (Optional)</label>
          <input type="text" id="input-title" placeholder="Letter subject or 'Flower Bouquet'..." class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-1">Attach Crayon Bouquet? (Optional)</label>
          <select id="input-bouquet" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm bg-white">
            <option value="none">No Flowers (Just Letter)</option>
            <option value="roses">🌹 Red Roses Bouquet</option>
            <option value="wildflowers">💐 Spring Wildflowers</option>
            <option value="sunflowers">🌻 Golden Sunflowers</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-1">Letter Content</label>
          <textarea id="input-content" rows="5" placeholder="Write your letter here..." class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-stone-500 hover:bg-stone-100 transition">Cancel</button>
          <button type="submit" id="submit-btn" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm">
            💌 Send & Save Letter
          </button>
        </div>
      </form>
    </div>
  </div>

  <footer class="text-center py-6 text-xs text-stone-400 border-t border-stone-200">
    Made with ❤️ for both of you. Always connected.
  </footer>

  <!-- SCRIPT LOGIC -->
  <script>
    const STORAGE_KEY = 'our_sanctuary_data';
    const BIN_ID = "6ab941fbac6210605afb43f6";
    const MASTER_KEY = "$2a$10$ZLaO4X0kBeZz10uq8UvgP.U7LmRqLFwJdG70bNO/6LW/nqBXuqUa6";

    let appData = { letters: [], notes: [], pets: 0 };

    // INITIAL LOAD FROM LOCAL STORAGE (INSTANT SHOW)
    function loadLocalData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          appData = JSON.parse(saved);
        } catch (e) {}
      }
      if (!appData.letters) appData.letters = [];
      if (!appData.notes) appData.notes = [];
      if (appData.pets === undefined) appData.pets = 0;
      renderAll();
    }

    function saveLocalData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      renderAll();
      syncToCloudBackground();
    }

    // BACKGROUND CLOUD SYNC (NON-BLOCKING)
    async function syncToCloudBackground() {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
          },
          body: JSON.stringify(appData)
        });
      } catch (err) {
        console.log("Background cloud sync error:", err);
      }
    }

    async function fetchCloudBackground() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY }
        });
        if (res.ok) {
          const json = await res.json();
          if (json.record) {
            appData = json.record;
            if (!appData.letters) appData.letters = [];
            if (!appData.notes) appData.notes = [];
            if (appData.pets === undefined) appData.pets = 0;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            renderAll();
          }
        }
      } catch (err) {}
    }

    // RENDER UI
    function renderAll() {
      document.getElementById("count-letters").innerText = appData.letters.length;
      document.getElementById("count-notes").innerText = appData.notes.length;
      document.getElementById("pet-counter").innerText = appData.pets;

      // Render Letters
      const lettersList = document.getElementById("letters-list");
      if (appData.letters.length === 0) {
        lettersList.innerHTML = `<div class="col-span-full text-center py-16 bg-white rounded-3xl border border-stone-200/80 shadow-sm"><p class="text-stone-500 font-medium">No letters or bouquets sent yet!</p><p class="text-xs text-stone-400 mt-1">Write a letter or bouquet above to get started.</p></div>`;
      } else {
        lettersList.innerHTML = appData.letters.map(letter => {
          let bouquetSvg = '';
          if (letter.bouquet === 'roses') {
            bouquetSvg = `<div class="p-3 bg-rose-50 rounded-2xl flex items-center justify-center crayon-style mb-3">
              <svg width="70" height="70" viewBox="0 0 100 100"><path d="M50 90 L35 40 M50 90 L50 35 M50 90 L65 40" stroke="#15803D" stroke-width="4"/><circle cx="35" cy="35" r="14" fill="#E11D48"/><circle cx="50" cy="25" r="16" fill="#F43F5E"/><circle cx="65" cy="35" r="14" fill="#E11D48"/><path d="M30 65 Q50 80 70 65" stroke="#FB7185" stroke-width="6" fill="none"/></svg>
            </div>`;
          } else if (letter.bouquet === 'wildflowers') {
            bouquetSvg = `<div class="p-3 bg-indigo-50 rounded-2xl flex items-center justify-center crayon-style mb-3">
              <svg width="70" height="70" viewBox="0 0 100 100"><path d="M50 90 L30 40 M50 90 L50 30 M50 90 L70 40" stroke="#15803D" stroke-width="4"/><circle cx="30" cy="35" r="12" fill="#8B5CF6"/><circle cx="50" cy="22" r="14" fill="#EC4899"/><circle cx="70" cy="35" r="12" fill="#3B82F6"/></svg>
            </div>`;
          } else if (letter.bouquet === 'sunflowers') {
            bouquetSvg = `<div class="p-3 bg-amber-50 rounded-2xl flex items-center justify-center crayon-style mb-3">
              <svg width="70" height="70" viewBox="0 0 100 100"><path d="M50 90 L50 35" stroke="#15803D" stroke-width="5"/><circle cx="50" cy="30" r="22" fill="#F59E0B"/><circle cx="50" cy="30" r="10" fill="#78350F"/></svg>
            </div>`;
          }

          return `
            <div class="bg-white p-6 rounded-3xl border border-stone-200/80 shadow-sm space-y-3 hover:shadow-md transition">
              ${bouquetSvg}
              <div class="flex justify-between items-start border-b border-stone-100 pb-3">
                <div>
                  <h3 class="font-serif-title font-bold text-stone-800 text-lg">${escapeHtml(letter.title || 'Love Letter')}</h3>
                  <p class="text-xs text-stone-400 mt-0.5">From: <span class="font-semibold text-stone-600">${escapeHtml(letter.author)}</span> &bull; ${letter.date}</p>
                </div>
                <span class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded-full font-medium">💌 Saved</span>
              </div>
              ${letter.content ? `<p class="text-stone-700 text-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(letter.content)}</p>` : ''}
            </div>
          `;
        }).join("");
      }

      // Render Notes
      const notesGrid = document.getElementById("notes-grid");
      if (appData.notes.length === 0) {
        notesGrid.innerHTML = `<div class="col-span-full text-center py-8 text-stone-400 text-sm">No sticky notes yet.</div>`;
      } else {
        notesGrid.innerHTML = appData.notes.map(n => `
          <div class="bg-amber-100/70 border border-amber-200/80 p-4 rounded-2xl shadow-sm space-y-2">
            <p class="font-handwriting text-2xl text-amber-950">${escapeHtml(n.text)}</p>
            <p class="text-[10px] text-amber-700 text-right font-medium">— ${escapeHtml(n.author)}</p>
          </div>
        `).join("");
      }
    }

    // FORM SUBMISSION
    document.getElementById("write-letter-form").addEventListener("submit", (e) => {
      e.preventDefault();

      const author = document.getElementById("input-author").value.trim();
      const title = document.getElementById("input-title").value.trim();
      const bouquet = document.getElementById("input-bouquet").value;
      const content = document.getElementById("input-content").value.trim();

      const newLetter = {
        id: Date.now(),
        author,
        title,
        bouquet,
        content,
        date: new Date().toLocaleDateString()
      };

      appData.letters.unshift(newLetter);
      saveLocalData();

      document.getElementById("write-letter-form").reset();
      closeModal();
    });

    // ADD STICKY NOTE
    function addStickyNote() {
      const author = prompt("Your Name:") || "Anonymous";
      const text = prompt("Sticky Note Text:");
      if (!text) return;

      appData.notes.unshift({ id: Date.now(), author, text });
      saveLocalData();
    }

    // PET DOG
    function petDog(e) {
      const container = document.getElementById("dog-container");
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerText = ["❤️", "💖", "💕", "🐾"][Math.floor(Math.random() * 4)];
      
      const rect = container.getBoundingClientRect();
      const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
      const y = (e.clientY || rect.top + rect.height / 2) - rect.top;

      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      container.appendChild(heart);

      setTimeout(() => heart.remove(), 1800);

      const tail = document.getElementById("dog-tail");
      tail.style.transform = "rotate(15deg)";
      setTimeout(() => tail.style.transform = "rotate(0deg)", 200);

      appData.pets += 1;
      saveLocalData();
    }

    function switchTab(tab) {
      ['letters', 'notes'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "px-5 py-2.5 rounded-t-xl font-medium text-sm transition flex items-center gap-2 text-stone-600 hover:bg-stone-100";
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "px-5 py-2.5 rounded-t-xl font-medium text-sm transition flex items-center gap-2 bg-stone-800 text-white";
    }

    function openModal() { document.getElementById("letter-modal").classList.remove("hidden"); }
    function closeModal() { document.getElementById("letter-modal").classList.add("hidden"); }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadLocalData();
      fetchCloudBackground();
      setInterval(fetchCloudBackground, 5000);
    });
  </script>
</body>
</html>
